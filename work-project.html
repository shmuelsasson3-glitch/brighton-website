<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/images/brighton-icon.png">
  <link rel="apple-touch-icon" href="/assets/images/brighton-icon.png">
  <title id="pageTitle">Project - Brighton Lawn &amp; Landscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/src/main.css">
</head>
<body>

<div id="site-nav"></div>

<section class="proj-hero">
  <img class="proj-hero-img" id="projHeroImg" src="" alt="">
  <div class="proj-hero-ov"></div>
  <div class="proj-hero-inner">
    <div class="wrap">
      <a href="work.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Our Work
      </a>
      <div class="proj-tag" id="projTag"></div>
      <h1 id="projTitle"></h1>
    </div>
  </div>
</section>

<section class="proj-overview" id="projOverview" hidden>
  <div class="wrap">
    <div class="proj-overview-grid">
      <div>
        <span class="kicker kicker--light" id="overviewKicker">About the Project</span>
        <h2 id="overviewHeading"></h2>
        <p id="overviewBody"></p>
      </div>
      <div class="proj-stats-row" id="statsRow"></div>
    </div>
  </div>
</section>

<section class="proj-gallery">
  <div class="wrap">
    <div class="sec-head casc" style="max-width:600px; margin-bottom:44px;">
      <span class="kicker">Project Gallery</span>
      <h2>The <em>Work</em></h2>
    </div>
    <div class="gallery-cols casc" id="galleryCols"></div>
  </div>
</section>

<div class="cta-band">
  <div class="wrap">
    <h2>Want a Result Like <em>This?</em></h2>
    <p>Tell us about your property and we'll build a plan around it.</p>
    <a href="index.html#contact" class="btn btn-primary">Request a Quote</a>
  </div>
</div>

<div data-site-footer></div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close">&#10005;</button>
  <button class="lb-prev">&#8592;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next">&#8594;</button>
</div>

<script type="module" src="/src/js/pages/work-project.js"></script>
</body>
</html>
