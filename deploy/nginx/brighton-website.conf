server {
    server_name brightonlawnlandscape.com www.brightonlawnlandscape.com brightonlawn.com www.brightonlawn.com;

    root /var/www/brighton-website/public;
    index index.php;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|mp4|webm|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brightonlawnlandscape.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brightonlawnlandscape.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.brightonlawn.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = brightonlawn.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.brightonlawnlandscape.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = brightonlawnlandscape.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name brightonlawnlandscape.com www.brightonlawnlandscape.com brightonlawn.com www.brightonlawn.com;
    return 404; # managed by Certbot
}
