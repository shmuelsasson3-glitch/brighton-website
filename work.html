<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/images/brighton-icon.png">
  <link rel="apple-touch-icon" href="/assets/images/brighton-icon.png">
  <title>Our Work | Brighton Lawn &amp; Landscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/src/main.css">
</head>
<body>

<div id="site-nav"></div>

<section class="page-hero">
  <div class="ph-bg"></div>
  <div class="ph-ov"></div>
  <div class="ph-inner">
    <div class="wrap">
      <span class="ph-kicker">Our Work</span>
      <h1>Projects We're <em>Proud Of</em></h1>
      <p>A growing portfolio of completed residential and commercial projects across NJ &amp; PA.</p>
    </div>
  </div>
</section>

<section class="work-wrap">
  <div class="wrap">
    <div class="work-filters">
      <button class="wfilter active" data-filter="residential">Residential</button>
      <button class="wfilter" data-filter="commercial">Commercial</button>
      <button class="wfilter" data-filter="all">All</button>
    </div>

    <div class="proj-grid casc" id="workGrid"></div>

  </div>
</section>

<div class="cta-band">
  <div class="wrap">
    <h2>Have a Project in <em>Mind?</em></h2>
    <p>Tell us about your property and we'll handle the rest, from design to installation.</p>
    <a href="/index.html#contact" class="btn btn-primary">Request a Quote</a>
  </div>
</div>

<div data-site-footer></div>

<script type="module" src="/src/js/pages/work.js"></script>
</body>
</html>
