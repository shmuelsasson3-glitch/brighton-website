# Clean URLs for all projects going forward (new ones added via the admin get this for free).
[[redirects]]
  from = "/work/*"
  to = "/work-project.html?slug=:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
