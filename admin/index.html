<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/images/brighton-icon.png">
  <title>Admin - Brighton Lawn &amp; Landscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/pages/admin.css">
</head>
<body class="admin-body">

<div id="loginView" class="admin-center">
  <form id="loginForm" class="admin-card">
    <h1>Brighton Admin</h1>
    <div class="admin-field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" required autocomplete="username">
    </div>
    <div class="admin-field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;">Log In</button>
    <div class="admin-error" id="loginError" hidden></div>
  </form>
</div>

<div id="appView" hidden>
  <div class="admin-topbar">
    <h1>Brighton Admin</h1>
    <div style="display:flex; gap:8px;">
      <button class="admin-btn admin-btn-ghost admin-btn-sm" id="changePasswordBtn">Change Password</button>
      <button class="admin-btn admin-btn-ghost admin-btn-sm" id="logoutBtn">Log Out</button>
    </div>
  </div>

  <div class="admin-shell">
    <div class="admin-tabs">
      <button class="admin-tab active" id="tabProjectsBtn" type="button">Projects</button>
      <button class="admin-tab" id="tabVideosBtn" type="button">Videos</button>
    </div>

    <div id="passwordView" class="admin-editor" hidden>
      <form id="passwordForm">
        <div class="admin-section">
          <h3>Change Password</h3>
          <div class="admin-field">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" required minlength="8" autocomplete="new-password">
          </div>
          <div class="admin-field">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password">
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="admin-btn admin-btn-primary">Update Password</button>
          <button type="button" class="admin-btn admin-btn-ghost" id="cancelPasswordBtn">Cancel</button>
        </div>
        <div class="admin-error" id="passwordError" hidden></div>
        <div class="admin-help" id="passwordSuccess" hidden style="margin-top:10px; color:#2f6d3f;">Password updated.</div>
      </form>
    </div>

    <div id="projectsSection">
    <div id="listView">
      <div class="admin-list-head">
        <span></span>
        <button class="admin-btn admin-btn-primary" id="newProjectBtn">New Project</button>
      </div>
      <table class="admin-table">
        <thead>
          <tr><th>Order</th><th></th><th>Title</th><th>Category</th><th>Photos</th><th>Published</th><th></th></tr>
        </thead>
        <tbody id="projectRows"></tbody>
      </table>
    </div>

    <div id="editorView" class="admin-editor" hidden>
      <form id="projectForm">
        <div class="admin-section">
          <h3>Hero</h3>
          <img id="coverPreview" class="admin-cover-preview" hidden>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <input type="file" id="coverInput" accept="image/jpeg,image/png,image/webp,image/gif" style="flex:1; min-width:200px;">
            <button type="button" class="admin-btn admin-btn-ghost admin-btn-sm" id="cropCoverBtn" hidden>Crop / Rotate</button>
          </div>
          <div class="admin-progress" id="coverProgress" hidden>
            <div class="admin-progress-bar"><div class="admin-progress-fill" id="coverProgressFill"></div></div>
            <span class="admin-progress-label" id="coverProgressLabel"></span>
          </div>
          <div class="admin-grid-2" style="margin-top:14px;">
            <div class="admin-field">
              <label>Focal point</label>
              <select id="fCoverPosition">
                <option value="top left">Top Left</option>
                <option value="top center">Top Center</option>
                <option value="top right">Top Right</option>
                <option value="center left">Center Left</option>
                <option value="center center" selected>Center (default)</option>
                <option value="center right">Center Right</option>
                <option value="bottom left">Bottom Left</option>
                <option value="bottom center">Bottom Center</option>
                <option value="bottom right">Bottom Right</option>
              </select>
            </div>
            <div class="admin-field">
              <label>Title</label>
              <input id="fTitle" required>
            </div>
            <div class="admin-field">
              <label>Slug</label>
              <input id="fSlug" required>
              <span class="admin-help">/work/&lt;slug&gt;</span>
            </div>
            <div class="admin-field">
              <label>Category</label>
              <select id="fCategory">
                <option value="residential">Residential</option>
                <option value="commercial">Commercial</option>
              </select>
            </div>
            <div class="admin-field">
              <label>Tag</label>
              <input id="fTag" placeholder="Residential - NJ" required>
            </div>
          </div>
          <div class="admin-toggle-row" style="margin-top:10px;">
            <input type="checkbox" id="fPublished" checked>
            <label for="fPublished">Published</label>
          </div>
        </div>

        <div class="admin-section">
          <h3>Overview (optional)</h3>
          <div class="admin-field">
            <label>Kicker</label>
            <input id="fOverviewKicker" placeholder="About the Project">
          </div>
          <div class="admin-field">
            <label>Heading</label>
            <input id="fOverviewHeading" placeholder="17 Homes. Fully <em>Landscaped.</em>">
            <span class="admin-help">Wrap words in &lt;em&gt;...&lt;/em&gt; for the green accent style.</span>
          </div>
          <div class="admin-field">
            <label>Body</label>
            <textarea id="fOverviewBody"></textarea>
          </div>
          <div id="statsList"></div>
          <button type="button" class="admin-btn admin-btn-ghost admin-btn-sm" id="addStatBtn">Add stat box</button>
        </div>

        <div class="admin-section">
          <h3>Gallery</h3>
          <div id="imagesList"></div>
          <input type="file" id="galleryInput" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
          <div class="admin-progress" id="galleryProgress" hidden>
            <div class="admin-progress-bar"><div class="admin-progress-fill" id="galleryProgressFill"></div></div>
            <span class="admin-progress-label" id="galleryProgressLabel"></span>
          </div>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="admin-btn admin-btn-primary">Save Project</button>
          <button type="button" class="admin-btn admin-btn-ghost" id="cancelEditBtn">Cancel</button>
          <button type="button" class="admin-btn admin-btn-danger" id="deleteProjectBtn" style="margin-left:auto;" hidden>Delete</button>
        </div>
        <div class="admin-error" id="formError" hidden></div>
      </form>
    </div>
    </div>

    <div id="videosSection" hidden>
      <div id="videosListView">
        <div class="admin-editor" style="margin-bottom:20px;">
          <h3 style="font-family:var(--font-head); font-size:15px; font-weight:600; color:var(--heading); margin-bottom:16px;">Add Video</h3>
          <div class="admin-grid-2">
            <div class="admin-field">
              <label>Title</label>
              <input id="newVideoTitle" placeholder="Spring Cleanup Walkthrough">
            </div>
            <div class="admin-field">
              <label>Date</label>
              <input type="date" id="newVideoDate">
            </div>
          </div>
          <div class="admin-field">
            <label>Video file</label>
            <input type="file" id="newVideoInput" accept="video/mp4,video/quicktime,video/webm">
          </div>
          <div class="admin-progress" id="videoUploadProgress" hidden>
            <div class="admin-progress-bar"><div class="admin-progress-fill" id="videoUploadProgressFill"></div></div>
            <span class="admin-progress-label" id="videoUploadProgressLabel"></span>
          </div>
          <button type="button" class="admin-btn admin-btn-primary" id="addVideoBtn" style="margin-top:6px;">Upload &amp; Add Video</button>
          <div class="admin-error" id="videoFormError" hidden></div>
        </div>

        <div class="admin-list-head">
          <span></span>
        </div>
        <table class="admin-table">
          <thead>
            <tr><th>Order</th><th>Preview</th><th>Title</th><th>Date</th><th></th></tr>
          </thead>
          <tbody id="videoRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="cropModal" class="admin-crop-overlay" hidden>
  <div class="admin-crop-dialog">
    <div class="admin-crop-stage">
      <img id="cropImage" alt="">
    </div>
    <div class="admin-crop-toolbar">
      <button type="button" class="admin-btn admin-btn-ghost admin-btn-sm" id="cropRotateLeft">&#8630; Rotate Left</button>
      <button type="button" class="admin-btn admin-btn-ghost admin-btn-sm" id="cropRotateRight">&#8631; Rotate Right</button>
      <button type="button" class="admin-btn admin-btn-ghost admin-btn-sm" id="cropReset">Reset</button>
      <span style="flex:1;"></span>
      <button type="button" class="admin-btn admin-btn-ghost admin-btn-sm" id="cropCancel">Cancel</button>
      <button type="button" class="admin-btn admin-btn-primary admin-btn-sm" id="cropSave">Use This Crop</button>
    </div>
    <div class="admin-error" id="cropError" hidden></div>
  </div>
</div>

<script type="module" src="/src/js/pages/admin.js"></script>
</body>
</html>
